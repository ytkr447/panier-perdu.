<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable - Panier Perdu</title>
<style>
:root{--bg:#F6F1E7;--ink:#17201B;--accent:#C2410C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{max-width:480px}
.code{font-family:Georgia,"Times New Roman",serif;font-size:72px;font-weight:700;color:var(--accent);line-height:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:12px 0}
p{margin:0 0 24px}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:14px 22px;font-weight:700}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>Ce panier s'est perdu en route.</h1>
<p>La page que tu cherches n'existe pas ou a changé d'adresse.</p>
<a href="/">Retour à l'accueil</a>
</main>
</body>
</html>
